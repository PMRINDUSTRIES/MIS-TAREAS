<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tareas · PMR</title>
<style>
  :root {
    --accent: #e4483c;
    --accent-soft: #fdecea;
    --bg: #f7f7f5;
    --surface: #ffffff;
    --sidebar: #faf9f7;
    --text: #1f2024;
    --text-soft: #8a8a94;
    --border: #ececec;
    --p1: #e4483c; --p2: #f2994a; --p3: #4a7cf2; --p4: #b7b7c0;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.05);
  }
  html[data-theme="dark"] {
    --accent: #ff6b5e;
    --accent-soft: #3a2320;
    --bg: #16161a;
    --surface: #1e1e24;
    --sidebar: #1a1a1f;
    --text: #ececf0;
    --text-soft: #8c8c98;
    --border: #2b2b33;
    --shadow: 0 1px 3px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
    transition: background .25s, color .25s;
  }

  /* ===== Pantalla de acceso (login / registro) ===== */
  .auth-screen {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .auth-card {
    width: 100%; max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 34px 30px;
  }
  .auth-brand { display: flex; align-items: center; gap: 11px; margin-bottom: 26px; }
  .auth-brand .logo { width: 38px; height: 38px; border-radius: 10px; background: var(--accent); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 15px; }
  .auth-brand b { font-size: 18px; }
  .auth-brand span { font-size: 12px; color: var(--text-soft); display: block; margin-top: -2px; }
  .auth-tabs { display: flex; gap: 6px; background: var(--bg); padding: 4px; border-radius: 10px; margin-bottom: 20px; }
  .auth-tab { flex: 1; border: none; background: none; padding: 9px; border-radius: 7px; font-size: 14px; color: var(--text-soft); cursor: pointer; font-weight: 500; }
  .auth-tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 600; }
  .auth-field { margin-bottom: 14px; }
  .auth-field label { display: block; font-size: 12px; color: var(--text-soft); margin-bottom: 6px; font-weight: 600; }
  .auth-field input {
    width: 100%; border: 1px solid var(--border); background: var(--bg); color: var(--text);
    border-radius: 10px; padding: 12px 13px; font-size: 14px; outline: none;
  }
  .auth-field input:focus { border-color: var(--accent); }
  .auth-btn {
    width: 100%; border: none; background: var(--accent); color: #fff;
    padding: 13px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer;
    margin-top: 6px; transition: filter .15s;
  }
  .auth-btn:hover { filter: brightness(1.08); }
  .auth-btn:disabled { opacity: .6; cursor: default; }
  .auth-msg { font-size: 13px; margin-top: 14px; text-align: center; min-height: 18px; }
  .auth-msg.err { color: var(--accent); }
  .auth-msg.ok { color: #2e9e5b; }

  /* Sidebar */
  .sidebar {
    width: 250px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    padding: 22px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 10px 20px;
  }
  .logo {
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 14px; letter-spacing: -.5px;
  }
  .brand b { font-size: 16px; letter-spacing: -.2px; }
  .brand span { font-size: 11px; color: var(--text-soft); display: block; margin-top: -2px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 11px; border-radius: 9px;
    cursor: pointer; font-size: 14px; color: var(--text);
    border: none; background: none; width: 100%; text-align: left;
    transition: background .15s;
  }
  .nav-item:hover { background: var(--border); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-item .ic { width: 18px; text-align: center; font-size: 15px; }
  .nav-item .count { margin-left: auto; font-size: 12px; color: var(--text-soft); }
  .nav-item.active .count { color: var(--accent); }
  .nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-soft); padding: 16px 11px 6px; font-weight: 600; }
  .side-footer { margin-top: auto; }
  .nav-item.premium { color: var(--accent); font-weight: 600; }
  .nav-item.premium:hover { background: var(--accent-soft); }
  .pay-banner { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 50; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow); display: none; }
  .pay-banner.ok { background: #e7f7ee; color: #1e8a4c; border: 1px solid #b6e6c9; }
  .pay-banner.cancel { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
  .user-box { display: flex; align-items: center; gap: 9px; padding: 9px 11px; font-size: 12px; color: var(--text-soft); border-top: 1px solid var(--border); margin-top: 8px; padding-top: 14px; }
  .user-box .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; }
  .user-box .email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    padding: 26px 40px 18px;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .topbar h1 { font-size: 26px; letter-spacing: -.5px; }
  .topbar .date { font-size: 13px; color: var(--text-soft); margin-top: 3px; }
  .progress-wrap { text-align: right; }
  .progress-wrap .pct { font-size: 22px; font-weight: 700; }
  .progress-bar { width: 130px; height: 6px; background: var(--border); border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .progress-bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .35s; }

  .content { flex: 1; overflow-y: auto; padding: 8px 40px 40px; }

  /* Add box */
  .add-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 6px 6px 6px 16px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: var(--shadow);
    margin-bottom: 22px;
  }
  .add-box input[type=text] {
    flex: 1; border: none; background: none; outline: none;
    font-size: 15px; color: var(--text); padding: 12px 0;
  }
  .add-box select, .add-box input[type=date] {
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    border-radius: 8px; padding: 7px 8px; font-size: 13px; outline: none; cursor: pointer;
  }
  .add-btn {
    border: none; background: var(--accent); color: #fff;
    width: 40px; height: 40px; border-radius: 10px; font-size: 22px;
    cursor: pointer; flex-shrink: 0; transition: transform .1s, filter .15s;
  }
  .add-btn:hover { filter: brightness(1.08); }
  .add-btn:active { transform: scale(.94); }

  /* Task list */
  .task {
    display: flex; align-items: center; gap: 13px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 9px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
    animation: pop .2s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .check {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--p4); flex-shrink: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px; transition: all .15s;
  }
  .check.p1 { border-color: var(--p1); } .check.p2 { border-color: var(--p2); }
  .check.p3 { border-color: var(--p3); } .check.p4 { border-color: var(--p4); }
  .task.done .check { background: var(--p4); border-color: var(--p4); }
  .task-main { flex: 1; min-width: 0; }
  .task-text { font-size: 15px; word-break: break-word; }
  .task.done .task-text { text-decoration: line-through; color: var(--text-soft); }
  .task-meta { display: flex; gap: 8px; margin-top: 4px; align-items: center; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
  .badge.date { background: var(--bg); color: var(--text-soft); }
  .badge.date.overdue { background: var(--accent-soft); color: var(--accent); }
  .badge.prio { color: #fff; }
  .badge.prio.p1 { background: var(--p1); } .badge.prio.p2 { background: var(--p2); }
  .badge.prio.p3 { background: var(--p3); } .badge.prio.p4 { display: none; }
  .del { background: none; border: none; color: var(--text-soft); font-size: 16px; cursor: pointer; opacity: 0; transition: opacity .15s, color .15s; padding: 4px; }
  .task:hover .del { opacity: 1; }
  .del:hover { color: var(--accent); }

  .empty { text-align: center; padding: 70px 20px; color: var(--text-soft); }
  .empty .big { font-size: 42px; margin-bottom: 12px; }
  .empty p { font-size: 14px; }

  .menu-btn { display: none; }
  @media (max-width: 720px) {
    .sidebar { position: fixed; z-index: 20; height: 100%; transform: translateX(-100%); transition: transform .25s; }
    .sidebar.open { transform: none; }
    .menu-btn { display: inline-flex; background: none; border: none; font-size: 22px; color: var(--text); cursor: pointer; margin-right: 8px; }
    .topbar, .content { padding-left: 20px; padding-right: 20px; }
    .add-box { flex-wrap: wrap; }
  }
</style>
</head>
<body>

  <!-- ===== Pantalla de acceso ===== -->
  <div class="auth-screen" id="authScreen">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="logo">PMR</div>
        <div><b>Tareas</b><span>by PMR Industries</span></div>
      </div>
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin">Entrar</button>
        <button class="auth-tab" id="tabRegister">Crear cuenta</button>
      </div>
      <div class="auth-field">
        <label>Email</label>
        <input type="email" id="authEmail" placeholder="tu@email.com" autocomplete="email">
      </div>
      <div class="auth-field">
        <label>Contraseña</label>
        <input type="password" id="authPass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="auth-btn" id="authBtn">Entrar</button>
      <div class="auth-msg" id="authMsg"></div>
    </div>
  </div>

  <!-- ===== App ===== -->
  <div class="pay-banner" id="payBanner"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">PMR</div>
      <div><b>Tareas</b><span>by PMR</span></div>
    </div>
    <button class="nav-item active" data-view="today"><span class="ic">◎</span> Hoy <span class="count" id="c-today"></span></button>
    <button class="nav-item" data-view="upcoming"><span class="ic">📅</span> Próximas <span class="count" id="c-upcoming"></span></button>
    <button class="nav-item" data-view="all"><span class="ic">≡</span> Todas <span class="count" id="c-all"></span></button>
    <button class="nav-item" data-view="done"><span class="ic">✓</span> Completadas <span class="count" id="c-done"></span></button>

    <div class="side-footer">
      <button class="nav-item premium" id="premiumBtn"><span class="ic">✦</span> Hazte Premium</button>
      <button class="nav-item" id="themeToggle"><span class="ic">☾</span> Modo oscuro</button>
      <button class="nav-item" id="logoutBtn"><span class="ic">⎋</span> Cerrar sesión</button>
      <div class="user-box">
        <div class="avatar" id="userAvatar">?</div>
        <div class="email" id="userEmail">—</div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:flex-end">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div>
          <h1 id="viewTitle">Hoy</h1>
          <div class="date" id="todayDate"></div>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="pct" id="pct">0%</div>
        <div class="progress-bar"><i id="progressFill"></i></div>
      </div>
    </div>

    <div class="content">
      <div class="add-box">
        <input type="text" id="newTask" placeholder="Añadir una tarea…" autocomplete="off">
        <select id="prio" title="Prioridad">
          <option value="4">Prioridad</option>
          <option value="1">P1 · Urgente</option>
          <option value="2">P2 · Alta</option>
          <option value="3">P3 · Media</option>
          <option value="4">P4 · Baja</option>
        </select>
        <input type="date" id="due" title="Fecha límite">
        <button class="add-btn" id="addBtn">+</button>
      </div>
      <div id="list"></div>
    </div>
  </main>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  // ===== Conexión a Supabase =====
  const SUPABASE_URL = "https://yyadbtxsvyrbyzbwxwsh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5YWRidHhzdnlyYnl6Ynd4d3NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NTc0MjQsImV4cCI6MjEwNDUzMzQyNH0.xNHbLlOAUzomPftaWhQ5WmQQWRPWQPVroCSdtDY3v58";
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ===== Estado =====
  let tasks = [];
  let view = "today";
  let user = null;

  // ===== Autenticación =====
  const authScreen = document.getElementById("authScreen");
  const authEmail = document.getElementById("authEmail");
  const authPass = document.getElementById("authPass");
  const authBtn = document.getElementById("authBtn");
  const authMsg = document.getElementById("authMsg");
  const tabLogin = document.getElementById("tabLogin");
  const tabRegister = document.getElementById("tabRegister");
  let mode = "login"; // "login" | "register"

  function setMode(m) {
    mode = m;
    tabLogin.classList.toggle("active", m === "login");
    tabRegister.classList.toggle("active", m === "register");
    authBtn.textContent = m === "login" ? "Entrar" : "Crear cuenta";
    authMsg.textContent = ""; authMsg.className = "auth-msg";
    authPass.setAttribute("autocomplete", m === "login" ? "current-password" : "new-password");
  }
  tabLogin.onclick = () => setMode("login");
  tabRegister.onclick = () => setMode("register");

  function showMsg(text, type) { authMsg.textContent = text; authMsg.className = "auth-msg " + (type || ""); }

  async function doAuth() {
    const email = authEmail.value.trim();
    const pass = authPass.value;
    if (!email || !pass) { showMsg("Rellena email y contraseña.", "err"); return; }
    if (pass.length < 6) { showMsg("La contraseña debe tener al menos 6 caracteres.", "err"); return; }
    authBtn.disabled = true;
    try {
      if (mode === "login") {
        const { error } = await sb.auth.signInWithPassword({ email, password: pass });
        if (error) throw error;
      } else {
        const { data, error } = await sb.auth.signUp({ email, password: pass });
        if (error) throw error;
        if (data && data.user && !data.session) {
          showMsg("Cuenta creada. Revisa tu email para confirmar y luego entra.", "ok");
          authBtn.disabled = false;
          return;
        }
      }
    } catch (e) {
      let m = e.message || "Error de acceso.";
      if (/invalid login/i.test(m)) m = "Email o contraseña incorrectos.";
      if (/already registered/i.test(m)) m = "Ese email ya tiene cuenta. Entra en su lugar.";
      showMsg(m, "err");
      authBtn.disabled = false;
    }
  }
  authBtn.onclick = doAuth;
  authPass.addEventListener("keydown", e => { if (e.key === "Enter") doAuth(); });

  document.getElementById("logoutBtn").onclick = async () => { await sb.auth.signOut(); };

  // ===== Pago (Stripe vía función segura de Supabase) =====
  const premiumBtn = document.getElementById("premiumBtn");
  premiumBtn.onclick = async () => {
    premiumBtn.disabled = true;
    premiumBtn.innerHTML = '<span class="ic">…</span> Abriendo pago…';
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/create-checkout`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${SUPABASE_ANON_KEY}` },
      });
      const data = await res.json();
      if (data.url) { window.location.href = data.url; return; }
      throw new Error(data.error || "No se pudo iniciar el pago.");
    } catch (e) {
      console.error(e);
      alert("Error al iniciar el pago: " + e.message);
      premiumBtn.disabled = false;
      premiumBtn.innerHTML = '<span class="ic">✦</span> Hazte Premium';
    }
  };

  // Aviso al volver de Stripe
  (function () {
    const p = new URLSearchParams(location.search).get("pago");
    if (!p) return;
    const b = document.getElementById("payBanner");
    if (p === "ok") { b.className = "pay-banner ok"; b.textContent = "✓ Pago completado. ¡Gracias!"; }
    else { b.className = "pay-banner cancel"; b.textContent = "Pago cancelado."; }
    b.style.display = "block";
    setTimeout(() => { b.style.display = "none"; }, 5000);
    history.replaceState(null, "", location.pathname);
  })();

  // Reacciona a login / logout
  sb.auth.onAuthStateChange(async (_event, session) => {
    user = session ? session.user : null;
    if (user) {
      authScreen.style.display = "none";
      authBtn.disabled = false;
      document.getElementById("userEmail").textContent = user.email;
      document.getElementById("userAvatar").textContent = (user.email[0] || "?").toUpperCase();
      await loadTasks();
    } else {
      authScreen.style.display = "flex";
      tasks = [];
      render();
    }
  });

  // ===== Capa de datos (Supabase) =====
  async function loadTasks() {
    const { data, error } = await sb.from("tasks").select("*").order("created_at", { ascending: true });
    if (error) { console.error(error); return; }
    tasks = (data || []).map(r => ({ id: r.id, text: r.text, prio: r.priority, due: r.due_date, done: r.done }));
    render();
  }

  async function addTask(text, prio, due) {
    const clean = text.trim();
    if (!clean || !user) return;
    const row = { user_id: user.id, text: clean, priority: Number(prio) || 4, due_date: due || null, done: false };
    const { data, error } = await sb.from("tasks").insert(row).select().single();
    if (error) { console.error(error); return; }
    tasks.push({ id: data.id, text: data.text, prio: data.priority, due: data.due_date, done: data.done });
    render();
  }

  async function toggle(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    const newDone = !t.done;
    t.done = newDone; render();
    const { error } = await sb.from("tasks").update({ done: newDone }).eq("id", id);
    if (error) { console.error(error); t.done = !newDone; render(); }
  }

  async function remove(id) {
    const prev = tasks;
    tasks = tasks.filter(t => t.id !== id); render();
    const { error } = await sb.from("tasks").delete().eq("id", id);
    if (error) { console.error(error); tasks = prev; render(); }
  }

  // ===== Utilidades de fecha =====
  function todayStr() { const d = new Date(); return d.toISOString().slice(0,10); }
  function fmtDate(str) {
    const d = new Date(str + "T00:00:00");
    const t = todayStr();
    if (str === t) return "Hoy";
    const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
    if (str === tomorrow.toISOString().slice(0,10)) return "Mañana";
    return d.toLocaleDateString("es-ES", { day: "numeric", month: "short" });
  }
  function isOverdue(str) { return str && str < todayStr(); }

  // ===== Filtros por vista =====
  const titles = { today: "Hoy", upcoming: "Próximas", all: "Todas", done: "Completadas" };
  function visibleTasks() {
    const t = todayStr();
    if (view === "done") return tasks.filter(x => x.done);
    if (view === "today") return tasks.filter(x => !x.done && (!x.due || x.due <= t));
    if (view === "upcoming") return tasks.filter(x => !x.done && x.due && x.due > t);
    return tasks.filter(x => !x.done); // all
  }

  // ===== Render =====
  function render() {
    const list = document.getElementById("list");
    const items = visibleTasks().sort((a,b) => (a.prio - b.prio) || ((a.due||"9") > (b.due||"9") ? 1 : -1));
    list.innerHTML = "";

    if (items.length === 0) {
      list.innerHTML = '<div class="empty"><div class="big">🎉</div><p>Nada por aquí. Disfruta el momento.</p></div>';
    } else {
      items.forEach(t => {
        const el = document.createElement("div");
        el.className = "task" + (t.done ? " done" : "");
        const dueBadge = t.due ? `<span class="badge date ${isOverdue(t.due) && !t.done ? "overdue" : ""}">${fmtDate(t.due)}</span>` : "";
        const prioBadge = `<span class="badge prio p${t.prio}">P${t.prio}</span>`;
        el.innerHTML = `
          <div class="check p${t.prio}">${t.done ? "✓" : ""}</div>
          <div class="task-main">
            <div class="task-text"></div>
            <div class="task-meta">${prioBadge}${dueBadge}</div>
          </div>
          <button class="del">✕</button>`;
        el.querySelector(".task-text").textContent = t.text;
        el.querySelector(".check").onclick = () => toggle(t.id);
        el.querySelector(".del").onclick = () => remove(t.id);
        list.appendChild(el);
      });
    }

    // Contadores
    const t = todayStr();
    document.getElementById("c-today").textContent = tasks.filter(x => !x.done && (!x.due || x.due <= t)).length || "";
    document.getElementById("c-upcoming").textContent = tasks.filter(x => !x.done && x.due && x.due > t).length || "";
    document.getElementById("c-all").textContent = tasks.filter(x => !x.done).length || "";
    document.getElementById("c-done").textContent = tasks.filter(x => x.done).length || "";
    document.getElementById("viewTitle").textContent = titles[view];

    // Progreso
    const total = tasks.length, done = tasks.filter(x => x.done).length;
    const pct = total ? Math.round(done/total*100) : 0;
    document.getElementById("pct").textContent = pct + "%";
    document.getElementById("progressFill").style.width = pct + "%";
  }

  // ===== Eventos =====
  const input = document.getElementById("newTask");
  const prioSel = document.getElementById("prio");
  const dueInp = document.getElementById("due");
  function doAdd() { addTask(input.value, prioSel.value, dueInp.value); input.value = ""; dueInp.value = ""; prioSel.value = "4"; input.focus(); }
  document.getElementById("addBtn").onclick = doAdd;
  input.addEventListener("keydown", e => { if (e.key === "Enter") doAdd(); });

  document.querySelectorAll(".nav-item[data-view]").forEach(btn => {
    btn.onclick = () => {
      document.querySelector(".nav-item.active").classList.remove("active");
      btn.classList.add("active");
      view = btn.dataset.view;
      document.getElementById("sidebar").classList.remove("open");
      render();
    };
  });

  // Tema claro/oscuro
  const themeBtn = document.getElementById("themeToggle");
  function applyTheme(mode) {
    document.documentElement.setAttribute("data-theme", mode);
    themeBtn.innerHTML = mode === "dark" ? '<span class="ic">☀</span> Modo claro' : '<span class="ic">☾</span> Modo oscuro';
    try { localStorage.setItem("pmr_theme", mode); } catch(e) {}
  }
  themeBtn.onclick = () => applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  let savedTheme = "light";
  try { savedTheme = localStorage.getItem("pmr_theme") || "light"; } catch(e) {}
  applyTheme(savedTheme);

  // Menú móvil
  document.getElementById("menuBtn").onclick = () => document.getElementById("sidebar").classList.toggle("open");

  // Fecha de hoy en cabecera
  document.getElementById("todayDate").textContent = new Date().toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });

  setMode("login");
  render();
</script>
</body>
</html>
